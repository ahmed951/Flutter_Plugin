name: urwaypayment
description: This Flutter plugin provide merchants to easy and hasslefree integration with Urway Payment gateway API's.
version: 1.0.8
homepage: https://github.com/URWAYios/Flutter_Plugin.git

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.3
  permission_handler: ^10.0.0
  path_provider: ^2.0.1

  convert: ^3.0.0
  crypto: ^3.0.1
  connectivity_plus: any
  email_validator: ^2.0.1
  connectivity_macos: ^0.2.1+2
  device_info_plus: ^4.1.2
  dart_ipify: ^1.1.1
  apple_pay_flutter: 
    git:
      url: https://github.com/ahmed951/apple_pay_flutter
      ref: 8b95e0e6fe260567b03b6cb70cbfc00656bcd48f

  package_info_plus: ^1.4.3+1
  webview_flutter: 4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
